[package]
name = "omenmon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The shipped binary.
[[bin]]
name = "omenmon"
path = "src/main.rs"

[lib]
name = "omenmon_cli"
path = "src/lib.rs"

[dependencies]
hp-wmi = { path = "../hp-wmi" }
hp-ec = { path = "../hp-ec" }
hp-core = { path = "../hp-core" }
wmi = "0.14"
windows = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "omenmon-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "daemon"
path = "src/bin/daemon.rs"