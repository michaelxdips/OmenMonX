[package]
name = "omenmon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The shipped binary.
[[bin]]
name = "omenmon"
path = "src/main.rs"

[lib]
name = "omenmon_cli"
path = "src/lib.rs"

[features]
default = []
# Hardware probes: reverse-engineering instruments, not product features.
# They are excluded from the default build so `cargo build` produces only the
# real binary. Build them with `--features probes`.
probes = []

[dependencies]
hp-wmi = { path = "../hp-wmi" }
hp-ec = { path = "../hp-ec" }
hp-core = { path = "../hp-core" }
wmi = "0.14"
windows = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

# ---------------------------------------------------------------------------
# Probe binaries. Each is a standalone hardware instrument used during the
# 2026-10-21 reverse-engineering pass. All gated behind `--features probes`.
#
# They are kept in-tree because they are the evidence trail for REPORT-2026-10-21.md:
# every VERIFIED claim in that document can be re-run from here.
# ---------------------------------------------------------------------------

