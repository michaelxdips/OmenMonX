name: changelog

# Regenerates CHANGELOG.md from commit history at tag time. Runs on the
# release workflow's tag push; the file is committed back to master so the
# repo always carries a current changelog without hand-editing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog from tags
        shell: bash
        run: |
          {
            echo "# Changelog"
            echo
            echo "Generated from tagged releases; each section lists the"
            echo "commits between the previous tag and this one, grouped"
            echo "by type (feat / fix / perf / docs / build / probe / other)."
            echo
            for tag in $(git tag --sort=-creatordate); do
              echo "## $tag"
              # Group commits by conventional-commit type. Anything without a
              # recognized prefix lands in Other so nothing is silently dropped.
              prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || echo "")
              range="$tag"
              if [ -n "$prev" ]; then range="$prev..$tag"; fi
              for group in "Features:feat" "Fixes:fix" "Performance:perf" "Documentation:docs" "Build/CI:build" "Probes:probe" "Other:"; do
                label="${group%%:*}"; prefix="${group#*:}"
                if [ -z "$prefix" ]; then
                  git log "$range" '--pretty=format:- %s' | grep -Ev -- "-[[:space:]]*(feat|fix|perf|docs|build|probe)[(:]" || true
                else
                  git log "$range" '--pretty=format:- %s' | grep -E -- "-[[:space:]]*${prefix}[(:]" || true
                fi
              done
              echo
            done
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Commit if changed
        shell: bash
        run: |
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: regenerate CHANGELOG.md for ${{ github.ref_name }}"
            git push origin HEAD:${GITHUB_REF_NAME%-*} 2>/dev/null || \
              git push origin HEAD:master
          fi
