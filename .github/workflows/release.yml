name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # A release must not be built from code that fails its own gates.
      - name: Tests
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Collect artifacts
        shell: pwsh
        run: |
          # Must match the allowlist in ci.yml and in
          # omenmon-cli/src/lib.rs::no_probe_leaks_into_release. An earlier version
          # of this step listed only three, so the leak check rejected the
          # legitimate daemon.exe and watch.exe.
          $shipped = @('omenmon.exe','omenmon-gui.exe','omenmon-setup.exe','daemon.exe')
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($name in $shipped) {
            $src = "target/release/$name"
            if (-not (Test-Path $src)) { Write-Error "missing $name"; exit 1 }
            Copy-Item $src dist/
          }
          # Anything else in target/release is a probe and must not ship.
          $leaked = Get-ChildItem target/release -Filter *.exe |
            Where-Object { $shipped -notcontains $_.Name }
          if ($leaked) {
            Write-Error "probes leaked into the release: $($leaked.Name -join ', ')"
            exit 1
          }
          Copy-Item README.md, LICENSE dist/
          Write-Host "dist:"; Get-ChildItem dist | Select-Object Name, Length

      # The updater verifies a SHA-256 before running anything it downloads, so
      # publish a checksum file next to the assets. Without it, the only digest a
      # user can check against is GitHub's own API, which is exactly what the
      # updater already does - this is the human-readable second opinion.
      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      # Portable zip: everything a user needs in one archive, no installer.
      # The setup binary and the README install section both point users
      # here when they do not want a Program Files install.
      - name: Portable zip (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/omenmon.exe, dist/omenmon-gui.exe,
            dist/daemon.exe, dist/omenmon-setup.exe, dist/SHA256SUMS.txt,
            dist/README.md, dist/LICENSE `
            -DestinationPath dist/OmenMonX-portable.zip -Force
          $zipHash = (Get-FileHash dist/OmenMonX-portable.zip -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path dist/SHA256SUMS.txt -Value "$zipHash  OmenMonX-portable.zip" -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: omenmon-windows
          path: dist/

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
