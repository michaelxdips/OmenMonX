name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/omenmon.exe dist/
          Copy-Item target/release/omenmon-gui.exe dist/
          Copy-Item target/release/omenmon-setup.exe dist/
          Copy-Item README.md, LICENSE dist/

      - name: Upload artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: omenmon-windows
          path: dist/

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
